# Production web serving: static SPA + reverse-proxy to the backend so the
# browser still talks to one origin (the relative /api/* calls just work).
# Hash history means there are no real server paths to fall back for, but the
# try_files below is harmless and keeps a direct refresh working.
server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets are immutable; index.html must never be cached so a
  # deploy is picked up on next load.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }

  # ${API_UPSTREAM} is substituted from env at container start (see Dockerfile).
  location /api/ {
    # Docker's embedded DNS. A literal hostname in proxy_pass is resolved ONCE at
    # boot and cached forever, so a backend recreate (new IP) turns every /api
    # call into a 502. Resolving through a variable forces per-request lookup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (/api/runs/*/stream): stream tokens through, no buffering, no timeout.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_set_header Connection "";
  }
}

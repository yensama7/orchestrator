# Lineage — one command to bring the console up. §7 gates Run on a compose
# file; this is that file for the whole system.
#
# db gets the real schema (§18.4 RLS included) on first boot; the backend
# re-applies it idempotently on every start to close drift. web is a static
# nginx build that reverse-proxies /api to the backend, and only starts once
# the backend reports healthy.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lineage
      POSTGRES_PASSWORD: lineage
      POSTGRES_DB: lineage
    volumes:
      - pgdata:/var/lib/postgresql/data
      # first-boot: Postgres runs every migration in NNN order. The backend's
      # runner (db/tenancy.py) re-applies them idempotently on every start to
      # close drift on an existing volume.
      - ./backend/lineage/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineage"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # the app connects as the NOBYPASSRLS `app` role — RLS is the boundary (§18.4)
      APP_DATABASE_URL: postgres://app:app@db:5432/lineage
      # owner URL, used once on boot to apply the idempotent schema (drift-proof)
      MIGRATE_DATABASE_URL: postgres://lineage:lineage@db:5432/lineage
      # secret-at-rest key for API keys entered in Settings (§P5, vault.py).
      # OPTIONAL: when unset, the backend auto-generates one and persists it to
      # the `secrets` volume below (~/.lineage), so keys are encrypted at rest
      # with zero config. Set it explicitly (e.g. in a .env next to this compose)
      # to pin the key yourself or point at a KMS-derived key.
      LINEAGE_SECRET_KEY: ${LINEAGE_SECRET_KEY:-}
      # One OpenRouter key drives every OpenRouter model (any `vendor/model` slug
      # assigned to any agent) — no per-model key entry in Settings. When a model
      # has no stored credential, ApiTransport falls back to this env var. Put it
      # in a .env next to this compose: OPENROUTER_API_KEY=sk-or-...
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Local models (Ollama). Defaults to the always-on `ollama` service below;
      # point it at a host Ollama (http://host.docker.internal:11434) if you run
      # your own. Unset/unreachable → the free echo stand-in, so nothing breaks.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    volumes:
      # persists the auto-generated secret-at-rest key across restarts; drop this
      # volume and stored API keys become unrecoverable (as with any lost key).
      - secrets:/home/app/.lineage
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      # nginx reverse-proxies /api to this upstream (§7). Same-origin, so the
      # backend needs no CORS in this topology.
      API_UPSTREAM: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # Local-model runtime. Always on — the default fingerprinting model
  # (qwen2.5:3b) is the planner's local default (_pick.py), so the system uses a
  # real model out of the box. The app containers don't depend on it, so a slow
  # first-boot model download never blocks the console; fingerprinting falls back
  # to the heuristic until the model is ready, then auto-upgrades.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
    # NVIDIA GPU passthrough: needs the nvidia-container-toolkit on the host.
    # Uncomment to use a GPU; Ollama runs CPU-only without it (smaller models).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - { driver: nvidia, count: all, capabilities: [gpu] }

  # One-shot: pulls the default fingerprinting model into the shared `ollama`
  # volume once the server is healthy, then exits. Idempotent — Ollama skips the
  # download if the model is already in the volume, so every `up` after the first
  # is instant. Reuses the server image, so no extra image to pull. Download more
  # models later from Settings → Local models; this one is always present.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"

volumes:
  pgdata:
  ollama:
  secrets:
